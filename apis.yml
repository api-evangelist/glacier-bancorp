  description: The OpenID Connect issuer Glacier Bank serves at connect.glacierbank.com for its Jack Henry
    Banno Digital Toolkit tenant. Issuer https://connect.glacierbank.com/a/consumer/api/v0/oidc; the base
    URL follows the documented Banno tenant pattern https://<institution-host>/a/consumer/api/v0 (https://jackhenry.dev/open-api-docs/consumer-api/overview/baseurl/).
    The scope and claim vocabulary is Jack Henry's; the deployment and every endpoint host is Glacier's.
    Placeholder hosts api.glacierbancorp.com and developer.glacierbancorp.com, previously recorded here,
    do not resolve and were removed.
