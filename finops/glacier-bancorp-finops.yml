    description: Reconcile partner usage against bank-issued treasury management statements and ACH/wire
      activity reports.
  - name: Allocation
    description: Allocate banking-service charges to the legal entity holding the account; tag transactional
      volume by the originating product/business unit.
  - name: Optimization
    description: Negotiate volume tiers in the treasury management contract; consolidate accounts to qualify
      for relationship pricing.
  - name: Accountability
    description: Treasury function owns banking-fee management and reviews bank statement variances monthly.
