description: Glacier Bancorp is a multi-bank holding company headquartered in Kalispell, Montana. It does
  not publish a developer-facing API or commercial pricing for third-party consumers. Any API access (e.g.
  for treasury management or fintech partnerships) is negotiated bilaterally with the relevant subsidiary
  bank. Plans below remain as scaffold placeholders pending evidence of a public API offering.
notes: No public developer portal or API pricing was located. Treasury services and ACH/wire functionality
  are delivered through traditional banking channels rather than a self-service API. Mark reconciled true
  only after confirming a published developer program.
